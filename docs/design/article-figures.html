<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article figures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  body { background: #fff; font-family: 'Merriweather', Georgia, serif; margin: 0; }
  main.screen { width: auto; min-height: 0; display: block; overflow: visible; padding: 28px 32px 48px; }
  h1 { font-weight: 300; font-size: 30px; margin: 0 0 4px; letter-spacing: -.02em; }
  .lede { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .row { display: grid; grid-template-columns: 0.9fr 1.25fr 1.25fr; gap: 14px; align-items: start; margin: 0 0 26px; padding-bottom: 22px; border-bottom: 2px solid var(--line); }
  .col h3 { font: 700 12px Carlito, Arial, sans-serif; text-transform: uppercase; letter-spacing: .03em; color: var(--accent); margin: 0 0 6px; }
  .col h3 b { color: var(--muted); font-weight: 700; margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .before { border-radius: 10px; overflow: hidden; background: var(--band); }
  .before svg { display: block; width: 100%; }
  .after img, .after canvas, .after svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  .cap { font-size: 13px; color: var(--ink); margin-top: 6px; line-height: 1.35; }
</style>
</head>
<body>
<main class="screen">
  <h1 id="title">Article figures</h1>
  <p class="lede" id="lede"></p>
  <div id="rows"></div>
</main>
<script src="figures.js"></script>
<script src="figure-schematic.js"></script>
<script>
const W = 1280, H = 800;
/* ---------- the chartplotter: the GPS-track figures drawn as the screen you would actually look at ---------- */
function plotter(f, o = {}) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  // the helm pod and the unit's bezel
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a3e42'); g.addColorStop(1, '#1d2023'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16; ctx.fillStyle = '#0e0f11'; ctx.beginPath(); ctx.roundRect(90, 50, 1100, 700, 38); ctx.fill(); ctx.restore();
  g = ctx.createLinearGradient(90, 50, 90, 750); g.addColorStop(0, '#2a2d31'); g.addColorStop(1, '#101113'); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(98, 58, 1084, 684, 32); ctx.fill();
  for (let i = 0; i < 4; i++) { ctx.fillStyle = '#1c1e21'; ctx.beginPath(); ctx.roundRect(1092, 160 + i * 120, 66, 84, 14); ctx.fill(); ctx.strokeStyle = '#33373b'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = '#c8102e'; ctx.beginPath(); ctx.arc(1125, 650, 20, 0, 7); ctx.fill();
  // the screen: a chart in day colours
  const sx = 140, sy = 96, sw = 920, sh = 610; ctx.save(); ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 10); ctx.clip();
  ctx.fillStyle = '#d4ecf7'; ctx.fillRect(sx, sy, sw, sh);
  ctx.strokeStyle = 'rgba(70,140,190,.45)'; ctx.lineWidth = 2; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(sx + 120, sy + 90, 260 + k * 150, 170 + k * 110, 0.25, 0, 7); ctx.stroke(); }
  ctx.fillStyle = '#f0dd96'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 330, sy); ctx.bezierCurveTo(sx + 270, sy + 90, sx + 120, sy + 160, sx, sy + 190); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#8a7a40'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(30,60,90,.55)'; ctx.font = 'italic 22px Carlito, Arial'; for (const [x, y, t] of [[520, 260, '6'], [760, 330, '7'], [430, 520, '8'], [880, 560, '9'], [640, 610, '9']]) ctx.fillText(t, sx + x - 140, sy + y - 96);
  // the track from the figure, scaled into the screen
  const P = (x, y) => [sx + 140 + (x - 120) * 4.6, sy + 40 + (y - 40) * 4.6];
  const path = new Path2D(); const toks = f.track.match(/[MCL]|-?\d+(\.\d+)?/g); let i = 0, cmd = '';
  while (i < toks.length) { if (/[MCL]/.test(toks[i])) cmd = toks[i++]; const n = cmd === 'C' ? 6 : 2, v = toks.slice(i, i + n).map(Number); i += n; const q = []; for (let k = 0; k < n; k += 2) q.push(...P(v[k], v[k + 1])); if (cmd === 'M') path.moveTo(...q); else if (cmd === 'L') path.lineTo(...q); else path.bezierCurveTo(...q); }
  ctx.strokeStyle = '#d81b2a'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(path);
  const [ax, ay] = P(153, 81); ctx.fillStyle = '#1b2a44'; ctx.font = '700 34px Carlito'; ctx.textAlign = 'center'; ctx.fillText('⚓', ax, ay + 12);
  ctx.strokeStyle = 'rgba(216,27,42,.5)'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ax, ay, 120, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  const [bx, by] = P(...f.boat.slice(0, 2)); ctx.save(); ctx.translate(bx, by); ctx.rotate(f.boat[2] * Math.PI / 180); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(15, 18); ctx.lineTo(0, 10); ctx.lineTo(-15, 18); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, -90); ctx.stroke(); ctx.restore();
  // the data bar and the alarm
  ctx.fillStyle = 'rgba(18,22,28,.88)'; ctx.fillRect(sx, sy, sw, 64);
  ctx.textAlign = 'left'; ctx.fillStyle = '#e8eef2'; ctx.font = '700 30px Carlito'; ctx.fillText('03:00', sx + 24, sy + 43);
  ctx.font = '400 26px Carlito'; ctx.fillStyle = '#9fb2c2'; ctx.fillText('WIND', sx + 170, sy + 41); ctx.fillStyle = '#e8eef2'; ctx.font = '700 30px Carlito'; ctx.fillText('NW 26 kn', sx + 240, sy + 43);
  ctx.font = '400 26px Carlito'; ctx.fillStyle = '#9fb2c2'; ctx.fillText('SOG', sx + 430, sy + 41); ctx.fillStyle = '#e8eef2'; ctx.font = '700 30px Carlito'; ctx.fillText('0.8 kn', sx + 485, sy + 43);
  ctx.fillStyle = '#d81b2a'; ctx.beginPath(); ctx.roundRect(sx + sw - 290, sy + 12, 270, 42, 8); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '700 26px Carlito'; ctx.textAlign = 'center'; ctx.fillText('ANCHOR ALARM · DRAG', sx + sw - 155, sy + 42);
  ctx.textAlign = 'left'; ctx.strokeStyle = '#1b2a44'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx + 30, sy + sh - 30); ctx.lineTo(sx + 145, sy + sh - 30); ctx.stroke(); ctx.fillStyle = '#1b2a44'; ctx.font = '700 22px Carlito'; ctx.fillText('25 m', sx + 64, sy + sh - 40);
  ctx.restore();
  // pills
  const pill = (x, y, t, fill = '#fff', ink = '#000') => { ctx.font = '700 28px Carlito'; const w = ctx.measureText(t).width + 34; ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 12; ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 24, w, 48, 24); ctx.fill(); ctx.restore(); ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.fillText(t, x, y + 10); };
  const [ex, ey] = P(150, 58); pill(ex, ey - 26, 'earlier: swinging'); const [dx, dy] = P(205, 108); pill(dx + 120, dy, 'now: dragging', '#d81b2a', '#fff');
  return c;
}
const cubic = (p0, p1, p2, p3, n = 10) => Array.from({ length: n }, (_, k) => { const t = (k + 1) / n, u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; });

/* ---------- the after versions for each article: a 3D render (file) and a schematic (spec) per figure ---------- */
const AFTER = {
  'bareboat-skipper/anchoring': (() => {
    const s3 = (x, y) => [(x - 160) * 3, (y - 100) * 3], land1 = [[0, 200], [190, 200], [190, 135], [150, 124], [100, 123], [50, 126], [0, 130]].map(p => s3(...p)), land2 = [[250, 200], [320, 200], [320, 110], [300, 121], [275, 135], [250, 150]].map(p => s3(...p));
    const sp = (x, y, l) => { const [a, b] = s3(x, y); return { x: a, z: b, label: l }; };
    const tr = (() => { const m = (x, y) => [(x - 160) * 0.5, (y - 100) * 0.5]; return [m(150, 70), ...cubic(m(150, 70), m(138, 76), m(140, 88), m(152, 90)), ...cubic(m(152, 90), m(166, 92), m(170, 80), m(160, 72)), m(166, 82), m(200, 110), m(236, 138)]; })();
    const nb = [-15, -10, -5, 5, 10, 15].map(x => ({ x, z: 6.5, hdg: 180, plain: true }));
    return [
      { sch: { wind: 180, padPx: 40, title: 'Anchoring · shelter from the forecast wind', land: [land1, land2], spots: [sp(90, 95, 'A'), sp(220, 60, 'B'), sp(220, 150, 'C')], fit: [{ x: -470, z: -260 }, { x: 470, z: 290 }],
          texts: [{ ...sp(95, 170), text: 'LAND (south)', pill: false, size: 34 }, { ...sp(220, 182), text: 'channel', pill: false, size: 28 }], key: ['Forecast: wind backing south overnight, F5', 'Only A lies under the land when the wind goes south'] } },
      { profile: { depth: 6, bow: 1, chain: 35, formula: '(6 m + 1 m) × 5 = 35 m', title: 'Anchoring · how much chain (depth drawn deeper to read)', key: ['All-chain rode, the bow roller 1 m above the water', 'A gusty night: scope 5:1'] } },
      { sch: { wind: 90, padPx: 60, trueScale: true, title: 'Anchoring · swing room', anchors: [{ x: 0, z: 0, label: 'anchor' }], rocks: [{ x: 45, z: 0, label: 'rock' }], circles: [{ x: 0, z: 0, r: 52 }],
          boats: [{ you: true, x: -46, z: 0, hdg: 90, L: 13, noHeading: true, tag: 'lying to the east wind' }], paths: [{ pts: [[-39.5, 0], [0, 0]], c: 'ink', dash: '8 8', w: 4 }],
          dims: [{ a: [0, 0], b: [45, 0], text: '45 m', off: -70 }], texts: [{ x: -30, z: -48, text: 'swing 52 m', kind: 'accent' }], key: ['Chain 40 m in 5 m, boat 13 m: she swings 52 m round the anchor', 'Wind E now, going W: the stern will swing past the rock'] } },
      { sch: { padPx: 80, trueScale: true, minMpp: 0.04, title: 'Day shape · at anchor', boats: [{ x: 0, z: 0, hdg: 240, label: 'Yacht', tag: 'black ball forward', noHeading: true }], circles: [{ x: -2.4, z: 1.4, r: 1.25, fill: '#fff', c: 'ink', dash: '0' }, { x: -2.4, z: 1.4, r: 0.8, fill: 'var(--ink)', c: 'ink', dash: '0' }],
          anchors: [{ x: -21, z: 12, s: 0.9 }], paths: [{ pts: [[-5.2, 3], [-21, 12]], c: 'ink', dash: '8 8', w: 4 }], fit: [{ x: 6, z: -6 }], key: ['One black ball, forward where it is best seen', 'By day: a vessel at anchor'] } },
      { sch: { night: true, padPx: 80, trueScale: true, mpp: 0.055, title: 'Lights · at anchor', boats: [{ x: 0, z: 0, hdg: 220, label: 'Yacht', anchorLight: true, noHeading: true, tag: 'one all-round white' }], fit: [{ x: -12, z: -8 }, { x: 12, z: 8 }], key: ['One all-round white light where it is best seen', 'At night: a vessel at anchor, under 50 m'] } },
      { plotter: true, sch: { wind: 315, padPx: 80, title: 'Anchoring · is she dragging?', boats: [{ you: true, x: 40, z: 21, hdg: 315, noHeading: true, scale: 1.6 }], paths: [{ pts: tr, c: 'red', w: 6 }], anchors: [{ x: -4, z: -10, s: 0.8 }],
          texts: [{ x: -5, z: -21, text: 'earlier: swinging' }, { x: 26, z: 2, text: 'now: dragging', kind: 'red' }], key: ['Your GPS track over the last hour, 0300, wind NW F6', 'Loops while she swings; a straight line once she drags'] } },
      { sch: { padPx: 60, trueScale: true, title: 'Mediterranean mooring · stern-to', quays: [{ x1: -24, z1: -8, x2: 24, z2: 0 }], boats: [...nb.filter(b => Math.abs(b.x) > 1), { you: true, x: 0, z: 18, hdg: 180, noHeading: true }],
          anchors: [{ x: 0, z: 50, s: 0.9, label: 'drop here' }], paths: [{ pts: [[-0.8, 46], [-0.8, 24]], c: 'ink', dash: '8 8', w: 4 }, { pts: [[3.8, 44], [3.8, 14]], c: 'course', dash: '14 10', arrow: true }],
          dims: [{ a: [0, 0], b: [0, 50], text: '3–4 boat lengths', off: -150 }], fit: [{ x: 0, z: 60 }], texts: [{ x: -18, z: -4, text: 'QUAY', pill: false, size: 30 }, { x: -17, z: 34, text: 'reversing in', kind: 'accent' }], key: ['Drop 3–4 boat lengths off, then reverse to the quay paying out chain', 'The chain holds the bow; stern lines go to the quay'] } },
      { sch: { wind: 90, padPx: 60, trueScale: true, title: 'Mediterranean mooring · wind on the beam', quays: [{ x1: -24, z1: -8, x2: 24, z2: 0 }], boats: nb, spots: [{ x: 16, z: 42, label: 'B' }],
          paths: [{ pts: [[15, 38], [1, 8]], c: 'course', dash: '14 10', arrow: true }], texts: [{ x: 0, z: 4, text: 'your berth', kind: 'accent' }, { x: 16, z: 50, text: 'drop upwind' }, { x: -18, z: -4, text: 'QUAY', pill: false, size: 30 }],
          key: ['Wind on the beam of the berth, F4', 'From B, upwind, the chain holds the bow up to windward'] } },
      { sch: { padPx: 50, trueScale: true, mpp: 0.034, title: 'Alongside · breast lines and springs', quays: [{ x1: -22, z1: -5, x2: 22, z2: 0 }], boats: [{ you: true, x: 0, z: 3.6, hdg: 90, noHeading: true }],

          circles: [{ x: 0, z: -0.9, r: 0.45, fill: '#5b636b', c: 'ink', dash: '0' }],   // the springs: bow and stern cleats to one cleat abreast her middle
          texts: [{ x: 12, z: -7, text: 'bow line' }, { x: -12, z: -7, text: 'stern line' }, { x: 0, z: -7, text: 'springs', kind: 'red' }, { x: 0, z: -3, text: 'PONTOON', pill: false, size: 26 }], fit: [{ x: -16, z: -8 }, { x: 16, z: 7 }],
          key: ['Bow and stern lines hold her in to the pontoon', 'The springs stop her surging fore and aft'] } },
      { sch: { padPx: 70, trueScale: true, minMpp: 0.045, title: 'Mooring buoy · a slip line', boats: [{ you: true, x: 0, z: 6, hdg: 0, noHeading: true }], circles: [{ x: 0, z: -12, r: 1.3, fill: '#f2f1ec', c: 'ink', dash: '0' }],
          paths: [{ pts: [[-0.35, 0.6], [-0.55, -11]], c: 'line', w: 7 }, { pts: [[0.55, -11], [0.35, 0.6]], c: 'line', w: 7 }], texts: [{ x: 0, z: -15.5, text: 'buoy ring' }, { x: 5.5, z: -6, text: 'your own line' }, { x: -5, z: 3, text: 'same cleat' }], fit: [{ x: -8, z: -17 }, { x: 8, z: 13 }],
          key: ['Through the ring and back to the same cleat', 'To leave, let one end go and pull the line back aboard'] } },
    ];
  })(),
  'bareboat-skipper/buoyage': (() => {
    // a harbour entrance with a buoyed channel, coming in from the south
    const moles = [[[-230, -300], [-60, -300], [-60, -190], [-230, -175]], [[60, -300], [230, -300], [230, -178], [60, -190]]];
    const chan = hi => ({ padPx: 50, land: moles, marks: [[-60, -120], [-66, -20], [-72, 80]].map(([x, z], i) => ({ x, z, kind: 'lat-port', bearing: false, hi: hi === 'port' && i === 1 })).concat([[60, -120], [66, -20], [72, 80]].map(([x, z], i) => ({ x, z, kind: 'lat-stbd', bearing: false, hi: hi === 'stbd' && i === 1 }))),
      boats: [{ you: true, x: 0, z: 140, hdg: 0, noHeading: true }], paths: [{ pts: [[0, 115], [0, -170]], c: 'course', dash: '16 12', arrow: true }],

      { sch: { padPx: 60, title: 'Isolated danger mark', marks: [{ x: 0, z: -6, kind: 'iso', bearing: false, hi: true }], circles: [{ x: 0, z: 10, r: 60, c: 'red' }],
          boats: [{ you: true, x: -110, z: -110, hdg: 90, noHeading: true }], paths: [{ pts: [[-80, -110], [150, -110]], c: 'course', dash: '16 12', arrow: true }, { pts: [[150, 130], [-150, 130]], c: 'course', dash: '16 12', arrow: true }],
          texts: [{ x: 110, z: 40, text: 'danger under the mark', kind: 'red' }, { x: 0, z: -150, text: 'safe water all round', kind: 'accent' }], fit: [{ x: -170, z: -170 }, { x: 170, z: 160 }],
          key: ['A small danger with safe water all round it', 'Two black balls · black, red, black · Fl(2)'] } },
      { sch: { padPx: 50, title: 'Safe water mark · the landfall', land: moles, marks: [{ x: -45, z: 40, kind: 'safe', bearing: false, hi: true }], boats: [{ you: true, x: 10, z: 250, hdg: 0, noHeading: true }],
          paths: [{ pts: [[10, 225], [10, -150]], c: 'course', dash: '16 12', arrow: true }], texts: [{ x: 0, z: -240, text: 'HARBOUR', pill: false, size: 30 }, { x: -200, z: 120, text: 'safe water all round', kind: 'accent' }],
          key: ['Safe water all round: the landfall or mid-channel', 'Red and white stripes · red ball · Iso, Oc or LFl 10s'] } },

    const line = (a, b, col = 'ink', w = 4, dash) => ({ pts: [a, b], c: col, w, dash });
    const radio = (a, b, col = 'course') => ({ pts: [a, b], c: col, w: 5, dash: '6 12' });
    const at = (hdg, rel, d) => { const a = (hdg + rel) * Math.PI / 180; return { x: Math.round(d * Math.sin(a)), z: Math.round(-d * Math.cos(a)) }; };
    const you = (x, y, hdg = 0, o = {}) => ({ you: true, ...P(x, y), hdg, noHeading: true, ...o });
    const map = (title, key, o) => ({ noScale: true, sch: { padPx: 60, title, key, ...o } });

    return [
      map('Hearing a MAYDAY · what to note', ['14:05 MAYDAY · yacht Thalassa · 37°05′N 25°17′E', 'Holed, sinking · 4 persons: you are 3 miles off'],

      {}, {},
      map('On scene · relay between them', ['The MRCC directs the channel; the casualty is behind the island', 'You hear both: relay their messages'],
        { land: [[[0, 0], [320, 0], [320, 28], [0, 28]].map(c), [[128, 82], [160, 62], [196, 86], [202, 112], [166, 120], [126, 114]].map(c)], spots: [{ ...P(60, 20), label: 'M' }], boats: [you(165, 166), { ...P(62, 112), hdg: 0, label: 'casualty', noHeading: true, bearing: false }, { ...P(264, 104), hdg: 270, label: 'lifeboat', noHeading: true, bearing: false }],
          paths: [radio(c([72, 118]), c([150, 158])), radio(c([180, 158]), c([256, 110]))], texts: [t(...c([164, 96]), 'island', { pill: false, size: 26 }), t(...c([165, 194]), 'you hear both: relay', { kind: 'accent' })] }),
      { sch: { padPx: 80, wind: 330, title: 'Helicopter rescue · the brief', key: ['Steady course, the wind about 30° on the port bow', 'Sails down, deck cleared; never touch the winch wire before it has earthed'],
        boats: [{ you: true, x: 0, z: 0, hdg: 0, noHeading: false }], texts: [t(150, 60, 'steady course 000°', { kind: 'accent' })], fit: [{ x: -200, z: -220 }, { x: 220, z: 140 }] } },
    ];
  })(),
  'vhf-radio-operator/urgency': (() => {
    const t = (x, z, text, o = {}) => ({ x, z, text, ...o });
    const c = ([x, y]) => [(x - 160) * 3, (y - 100) * 3];
    const P = (x, y) => { const [a, b] = c([x, y]); return { x: a, z: b }; };
    const arr = (a, b, col = 'red', w = 6) => ({ pts: [a, b], c: col, w, arrow: true });
    const line = (a, b, col = 'ink', w = 4, dash) => ({ pts: [a, b], c: col, w, dash });
    const radio = (a, b, col = 'course') => ({ pts: [a, b], c: col, w: 5, dash: '6 12' });
    const at = (hdg, rel, d) => { const a = (hdg + rel) * Math.PI / 180; return { x: Math.round(d * Math.sin(a)), z: Math.round(-d * Math.cos(a)) }; };
    const you = (x, y, hdg = 0, o = {}) => ({ you: true, ...P(x, y), hdg, noHeading: true, ...o });
    const map = (title, key, o) => ({ noScale: true, sch: { padPx: 60, title, key, ...o } });

    return [{},
      map('PAN-PAN becomes MAYDAY', ['No engine, too deep to anchor, drifting onto a lee shore in F6', 'Rocks a mile downwind: the danger is now grave and imminent'],
        { land: [[[0, 200], [0, 162], [80, 142], [160, 154], [240, 166], [320, 148], [320, 200]].map(c)], boats: [you(110, 66, 250)], paths: [arr(c([110, 84]), c([110, 140]), 'red', 6), arr(c([40, 20]), c([40, 70]), 'red', 8)], rocks: [P(115, 156)],
          texts: [t(...c([110, 20]), 'wind F6, onshore', { kind: 'red' }), t(...c([210, 120]), 'rocks 1 mile downwind', { kind: 'red' }), t(...c([200, 60]), '1 hour later: drifting')] }),
      {}, {}, {},

};

(async () => {
  const q = new URLSearchParams(location.search), a = q.get('a') || 'bareboat-skipper/anchoring';
  const data = await (await fetch(`article-figs/${a.replace('/', '-')}.json?v=${Date.now()}`)).json(), after = AFTER[a] || [];
  // an article without entries above: each figure's schematic from figure-style/articles/<a>/<n>-plan.json, if there is one
  if (!AFTER[a]) for (const f of data.figs) { const r = await fetch(`figure-style/articles/${a}/${f.n}-plan.json?v=${Date.now()}`); after.push(r.ok ? await r.json() : {}); }
  document.getElementById('title').textContent = `${a.replace('/', ' · ')} · before and after`;
  document.getElementById('lede').textContent = data.lead;
  const rows = document.getElementById('rows');
  // Russian (?lang=ru): every display string of the schematic specs goes through figure-style/articles/<a>/ru.json
  // before drawing, so pills are sized for the Russian text; window.__strings lists the English strings per figure
  const SKIP = new Set(['kind', 'color', 'type', 'side', 'which', 'shape', 'id', 'fill', 'stroke', 'anchor', 'd', 'svg', 'font', 'align', 'dir', 'style', 'cls', 'class', 'dash', 'icon', 'plotter']);
  const CODE = /^(red|blue|green|yellow|accent|white|black|grey|gray|orange|dash|dashed|dotted|solid|port|stbd|left|right|middle|start|end|top|bottom|[a-zA-Z]{1,2}|[\d\s.,:°′″'"+-]*)$/;
  const deep = (v, k, fn) => typeof v === 'string' ? (SKIP.has(k) || CODE.test(v) ? v : fn(v)) : Array.isArray(v) ? v.map((x) => deep(x, k, fn)) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([kk, x]) => [kk, deep(x, kk, fn)])) : v;
  const RU = q.get('lang') === 'ru' ? await (await fetch(`figure-style/articles/${a}/ru.json?v=${Date.now()}`)).json() : null;
  if (RU) Object.assign(window.SCH_TEXT, { You: 'Вы', Other: 'Судно', Wind: 'Ветер', N: 'С', port: 'слева', stbd: 'справа', depth: 'глубина', bow: 'роульс', chain: 'цепь', s: 'с' });
  window.__strings = {};
  data.figs.forEach((f, i) => {
    const seen = new Set(); deep(after[i] || {}, '', (s) => { seen.add(s); return s; }); window.__strings[String(f.n)] = [...seen];
    if (RU) after[i] = deep(after[i] || {}, '', (s) => RU[s] ?? s);
  });
  data.figs.forEach((f, i) => {
    const A = after[i] || {}, row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="col"><h3>${f.n}. ${f.fig.type} <b>today</b></h3><div class="before" data-fig='${JSON.stringify(f.fig).replace(/'/g, '&#39;')}'></div><div class="cap">${f.section}${f.name ? ' · ' + f.name : ''}${f.cap ? ' · ' + f.cap : ''}</div></div>
      <div class="col after"><h3>3D <b>${A.plotter ? 'the chartplotter screen' : 'render'}</b></h3><div class="r3d"></div></div>
      <div class="col after"><h3>Schematic <b>${A.rhythm ? 'flash timing' : A.profile ? 'side view' : 'plan view'}</b></h3><div class="sch"></div></div>`;
    const r3d = row.querySelector('.r3d');
    if (A.plotter) { const c = plotter(f.fig); r3d.append(c); window.__renders = window.__renders || {}; window.__renders[String(f.n)] = c.toDataURL('image/jpeg', 0.92); }
    else { const im = new Image(); im.src = `figure-style/articles/${a}/${f.n}.jpg?v=${Date.now()}`; im.onerror = () => { r3d.innerHTML = '<div class="cap">not rendered yet</div>'; }; r3d.append(im); }
    row.querySelector('.sch').innerHTML = A.svg ? A.svg : A.rhythm ? schematicRhythm(A.rhythm) : A.profile ? schematicProfile(A.profile) : A.sch ? (A.noScale ? schematic(A.sch).replace(/<g><line x1="30"[\s\S]*?<\/g>/, '') : schematic(A.sch)) : '<div class="cap">no schematic</div>';
    // the drawer's own words (figure-schematic.js): You, Wind 200°, 200 m, the north arrow's N
    const OWN = [[/(\d) m\b/g, '$1 м'], [/^(\d[\d.,]*) (miles|M)$/, '$1 мили']];   // the scale bar, a bearing's distance
    if (RU) row.querySelectorAll('.sch text, .sch tspan').forEach((el) => {
      if (el.children.length) return; const s = el.textContent;
      if (RU[s] != null) { el.textContent = RU[s]; return; }
      for (const [re, to] of OWN) if (s.search(re) >= 0) { el.textContent = s.replace(re, to); return; }
    });
    rows.append(row);
  });
  paintFigures(document);
  await document.fonts.ready; document.body.dataset.done = '1';
})();
