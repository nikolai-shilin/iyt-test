<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="out"></div>
<script type="module">
// The rope figure as a 3D render, in the Helm and Drone light: a mooring line with a loop dropped over a
// cast-iron bollard on a granite quay, a yacht alongside. The knot is hidden behind the bollard on purpose:
// the questions ask which knot, so the picture shows the situation, never the answer.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 800, SS = 2; // rendered at 2x and scaled down for clean edges
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(w, h, draw, srgb = true, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noiseNormal(size, scale, amp) { // a tileable normal map from smoothed value noise
  const h = new Float32Array(size * size), g = new Float32Array((scale + 1) * (scale + 1)); for (let i = 0; i < g.length; i++) g[i] = rnd();
  const at = (x, y) => g[(y % scale) * (scale + 1) + (x % scale)];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const fx = x / size * scale, fy = y / size * scale, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, s = t => t * t * (3 - 2 * t);
    h[y * size + x] = (at(ix, iy) * (1 - s(tx)) + at(ix + 1, iy) * s(tx)) * (1 - s(ty)) + (at(ix, iy + 1) * (1 - s(tx)) + at(ix + 1, iy + 1) * s(tx)) * s(ty); }
  return canvasTex(size, size, (ctx) => { const im = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const dx = (h[y * size + (x + 1) % size] - h[y * size + (x - 1 + size) % size]) * amp, dy = (h[((y + 1) % size) * size + x] - h[((y - 1 + size) % size) * size + x]) * amp, n = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
      im.data[i] = (-dx / n * 0.5 + 0.5) * 255; im.data[i + 1] = (-dy / n * 0.5 + 0.5) * 255; im.data[i + 2] = (1 / n * 0.5 + 0.5) * 255; im.data[i + 3] = 255; }
    ctx.putImageData(im, 0, 0); }, false);
}

/* ---------- materials ---------- */
const granite = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#b9b5ad'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) { const r = rnd(); ctx.fillStyle = r < 0.45 ? `rgba(${40 + rnd() * 50 | 0},${40 + rnd() * 50 | 0},${42 + rnd() * 50 | 0},${0.5 + rnd() * 0.5})` : r < 0.75 ? `rgba(235,232,226,${0.4 + rnd() * 0.5})` : r < 0.9 ? `rgba(${170 + rnd() * 30 | 0},${135 + rnd() * 25 | 0},${115 + rnd() * 20 | 0},.6)` : 'rgba(20,20,22,.8)'; const s = 1 + rnd() * 3.5; ctx.fillRect(rnd() * w, rnd() * h, s, s * (0.6 + rnd() * 0.8)); }
  for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(60,55,45,${0.04 + rnd() * 0.06})`; ctx.beginPath(); ctx.ellipse(rnd() * w, rnd() * h, 20 + rnd() * 80, 10 + rnd() * 40, rnd() * 3, 0, 7); ctx.fill(); }
});
const graniteN = noiseNormal(256, 32, 6);
const stoneMat = new THREE.MeshStandardMaterial({ map: granite, normalMap: graniteN, normalScale: new THREE.Vector2(0.6, 0.6), roughness: 0.82 });

// Rope yarns: each strand is itself made of yarns twisted the other way, so the texture is diagonal ribs.
const yarnTex = (tracer) => canvasTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#ece6d6'; ctx.fillRect(0, 0, w, h);
  for (let k = -8; k < 16; k++) { const x0 = k * 16; const g = ctx.createLinearGradient(x0, 0, x0 + 16, 0); g.addColorStop(0, 'rgba(120,108,85,.55)'); g.addColorStop(0.35, 'rgba(255,253,245,.15)'); g.addColorStop(0.65, 'rgba(255,255,250,.35)'); g.addColorStop(1, 'rgba(120,108,85,.55)');
    ctx.save(); ctx.transform(1, 0, -0.6, 1, 0, 0); ctx.fillStyle = (tracer && k % 6 === 0) ? '#1e3a6e' : g; ctx.fillRect(x0, 0, 16, h * 1.0); ctx.restore(); }
  for (let i = 0; i < 1500; i++) { ctx.fillStyle = rnd() < 0.5 ? 'rgba(90,80,60,.12)' : 'rgba(255,255,255,.12)'; ctx.fillRect(rnd() * w, rnd() * h, 1, 3 + rnd() * 5); }
});
const yarnBump = canvasTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  for (let k = -8; k < 16; k++) { const x0 = k * 16, g = ctx.createLinearGradient(x0, 0, x0 + 16, 0); g.addColorStop(0, '#000'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, '#000'); ctx.save(); ctx.transform(1, 0, -0.6, 1, 0, 0); ctx.fillStyle = g; ctx.fillRect(x0, 0, 16, h); ctx.restore(); }
}, false);
const ropeMat = (tracer) => new THREE.MeshPhysicalMaterial({ map: yarnTex(tracer), bumpMap: yarnBump, bumpScale: 1.4, roughness: 0.78, sheen: 0.6, sheenRoughness: 0.6, sheenColor: new THREE.Color('#fff8ea') });

// Cast-iron bollard: black paint chipped to rust at the base and the cap rim, rust streaks running down.
const bollardMap = canvasTex(1024, 512, (ctx, w, h) => {
  ctx.fillStyle = '#1c1d1f'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { ctx.fillStyle = `rgba(${rnd() < 0.5 ? '255,255,255' : '0,0,0'},${rnd() * 0.06})`; ctx.fillRect(rnd() * w, rnd() * h, 2, 2); }
  const chip = (y0, y1, n) => { for (let i = 0; i < n; i++) { const x = rnd() * w, y = y0 + rnd() * (y1 - y0), r = 2 + rnd() * 10; ctx.fillStyle = `rgba(${78 + rnd() * 30 | 0},${40 + rnd() * 14 | 0},${22 + rnd() * 8 | 0},${0.55 + rnd() * 0.35})`; ctx.beginPath(); ctx.ellipse(x, y, r * (1 + rnd() * 1.5), r * 0.7, 0, 0, 7); ctx.fill(); } };
  chip(h * 0.76, h, 150); chip(h * 0.22, h * 0.3, 55); chip(h * 0.32, h * 0.72, 20);
  for (let i = 0; i < 70; i++) { const x = rnd() * w, y = h * (0.28 + rnd() * 0.03), l = h * (0.06 + rnd() * 0.3); const g = ctx.createLinearGradient(0, y, 0, y + l); g.addColorStop(0, 'rgba(95,48,24,.4)'); g.addColorStop(1, 'rgba(95,48,24,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, 2 + rnd() * 5, l); }
  // rope-polished band where lines bear on the barrel: bare grey iron
  const g = ctx.createLinearGradient(0, h * 0.6, 0, h * 0.72); g.addColorStop(0, 'rgba(120,120,118,0)'); g.addColorStop(0.5, 'rgba(120,120,118,.35)'); g.addColorStop(1, 'rgba(120,120,118,0)'); ctx.fillStyle = g; ctx.fillRect(0, h * 0.6, w, h * 0.12);
});
const bollardRough = canvasTex(256, 128, (ctx, w, h) => { ctx.fillStyle = 'rgb(0,165,0)'; ctx.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgb(0,${200 + rnd() * 55 | 0},0)`; ctx.fillRect(rnd() * w, rnd() < 0.6 ? rnd() * h * 0.15 : rnd() * h, 2 + rnd() * 4, 2 + rnd() * 4); } }, false);
const ironMat = new THREE.MeshStandardMaterial({ map: bollardMap, roughnessMap: bollardRough, roughness: 1, metalness: 0.15, normalMap: noiseNormal(256, 128, 2), normalScale: new THREE.Vector2(0.18, 0.18) });

/* ---------- geometry ---------- */
function ringScene() {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#c9d3d8');
  // setts: rows of granite blocks in a running bond, each slightly tilted and proud or sunk
  const sett = new RoundedBoxGeometry(0.2, 0.09, 0.11, 2, 0.014);
  const rows = [], cols = []; for (let z = -1.0; z < 3.2; z += 0.122) for (let x = -3.4 + ((Math.round(z / 0.122) % 2) ? 0.11 : 0); x < 3.4; x += 0.212) rows.push([x + (rnd() - 0.5) * 0.01, z + (rnd() - 0.5) * 0.008]);
  const im = new THREE.InstancedMesh(sett, stoneMat, rows.length), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  rows.forEach(([x, z], i) => { e.set((rnd() - 0.5) * 0.04, (rnd() - 0.5) * 0.06, (rnd() - 0.5) * 0.04); q.setFromEuler(e); m4.compose(V(x, -0.035 + (rnd() - 0.5) * 0.006, z), q, V(1, 1, 1)); im.setMatrixAt(i, m4); const c = new THREE.Color().setHSL(0.06 + rnd() * 0.06, 0.04 + rnd() * 0.08, 0.42 + rnd() * 0.26 + (rnd() < 0.08 ? -0.12 : 0)); im.setColorAt(i, c); });
  im.castShadow = im.receiveShadow = true; scene.add(im);
  const joint = new THREE.Mesh(new THREE.PlaneGeometry(8, 5).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#2f2c26', roughness: 1 })); joint.position.set(0, -0.045, 1.1); joint.receiveShadow = true; scene.add(joint);
  // coping stones along the quay edge
  for (let x = -3.6; x < 3.6; x += 0.92) { const b = new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.3, 0.52, 3, 0.03), stoneMat); b.position.set(x + (rnd() - 0.5) * 0.01, -0.13, -1.31); b.rotation.y = (rnd() - 0.5) * 0.01; b.castShadow = b.receiveShadow = true; scene.add(b); }
  // the quay wall, wet and weedy towards the water; the water itself
  const wall = canvasTex(512, 256, (ctx, w, h) => { ctx.fillStyle = '#6d685f'; ctx.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 42) for (let x = (y / 42 % 2) * 40; x < w; x += 80) { ctx.fillStyle = `rgb(${95 + rnd() * 30 | 0},${90 + rnd() * 28 | 0},${82 + rnd() * 25 | 0})`; ctx.fillRect(x + 2, y + 2, 76, 38); } const g = ctx.createLinearGradient(0, h * 0.5, 0, h); g.addColorStop(0, 'rgba(40,50,30,0)'); g.addColorStop(1, 'rgba(40,55,30,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }, true, [6, 1]);
  const qw = new THREE.Mesh(new THREE.PlaneGeometry(8, 1.0), new THREE.MeshStandardMaterial({ map: wall, roughness: 0.9 })); qw.position.set(0, -0.78, -1.57); scene.add(qw);
  const wn = noiseNormal(256, 16, 4); wn.repeat.set(10, 10);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: '#1d4249', roughness: 0.06, metalness: 0, normalMap: wn, normalScale: new THREE.Vector2(0.4, 0.4) })); water.position.y = -0.9; scene.add(water);
  // the yacht alongside: white gelcoat topsides, a grey rubbing strake, a pale non-skid deck, stanchions and lifelines
  const gel = new THREE.MeshPhysicalMaterial({ color: '#f3f3ef', roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08 });
  const hull = new THREE.Mesh(new RoundedBoxGeometry(11, 1.75, 3.4, 6, 0.38), gel); hull.position.set(-0.6, -0.36, -3.52); hull.castShadow = hull.receiveShadow = true; scene.add(hull);
  const strake = new THREE.Mesh(new RoundedBoxGeometry(11.04, 0.07, 3.48, 3, 0.03), new THREE.MeshStandardMaterial({ color: '#3b3e42', roughness: 0.5 })); strake.position.set(-0.6, 0.46, -3.52); scene.add(strake);
  const stripe = new THREE.Mesh(new RoundedBoxGeometry(11.02, 0.06, 3.44, 3, 0.025), new THREE.MeshStandardMaterial({ color: '#1d3557', roughness: 0.35 })); stripe.position.set(-0.6, 0.3, -3.52); scene.add(stripe);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.02, 3.0), new THREE.MeshStandardMaterial({ color: '#e4dfd2', roughness: 0.9, normalMap: noiseNormal(128, 64, 2) })); deck.position.set(-0.6, 0.52, -3.52); deck.receiveShadow = true; scene.add(deck);
  const toe = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.05, 0.04), new THREE.MeshStandardMaterial({ color: '#8a8f94', metalness: 0.8, roughness: 0.3 })); toe.position.set(-0.6, 0.555, -1.86); scene.add(toe);
  const steel = new THREE.MeshStandardMaterial({ color: '#d7dadd', metalness: 1, roughness: 0.18 });
  for (let x = -4.6; x < 4; x += 1.6) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.014, 0.62, 10), steel); s.position.set(x, 0.84, -1.9); s.castShadow = true; scene.add(s); }
  for (const y of [0.85, 1.13]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 9.4, 6).rotateZ(Math.PI / 2), steel); l.position.set(-0.6, y, -1.9); scene.add(l); }
  const cleat = new THREE.Mesh(new RoundedBoxGeometry(0.2, 0.05, 0.09, 2, 0.02), steel); cleat.position.set(-1.25, 0.575, -1.9); scene.add(cleat);
  // a fender between the hull and the coping, hanging on its line from a stanchion
  const fender = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.42, 8, 24), new THREE.MeshPhysicalMaterial({ color: '#f6f6f2', roughness: 0.35, clearcoat: 0.6 })); fender.position.set(0.9, -0.32, -1.68); fender.castShadow = true; scene.add(fender);
  return scene;
}

function bollard() {
  const prof = [[0, 0], [0.225, 0], [0.232, 0.012], [0.229, 0.032], [0.214, 0.044], [0.16, 0.048], [0.132, 0.058], [0.122, 0.085], [0.114, 0.16], [0.11, 0.23], [0.113, 0.3], [0.12, 0.345], [0.135, 0.372], [0.172, 0.382], [0.18, 0.395], [0.177, 0.41], [0.162, 0.42], [0.125, 0.442], [0.07, 0.458], [0, 0.462]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), ironMat); b.castShadow = b.receiveShadow = true; g.add(b);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.016, 6), ironMat); bolt.position.set(Math.cos(a) * 0.185, 0.053, Math.sin(a) * 0.185); bolt.castShadow = true; g.add(bolt); }
  return g;
}

// A three-strand rope along a centreline: parallel-transport frames, each strand a helix round the centre,
// built as its own tube so the lay reads in the light.
function tubeFromPoints(P, r, radial, uvLen) {
  const n = P.length, T = [], N = [], B = [];
  for (let i = 0; i < n; i++) T.push(P[Math.min(i + 1, n - 1)].clone().sub(P[Math.max(i - 1, 0)]).normalize());
  let n0 = new THREE.Vector3(0, 1, 0).cross(T[0]); if (n0.lengthSq() < 1e-6) n0 = V(1, 0, 0).cross(T[0]); N.push(n0.normalize()); B.push(T[0].clone().cross(N[0]));
  for (let i = 1; i < n; i++) { const v = N[i - 1].clone().sub(T[i].clone().multiplyScalar(N[i - 1].dot(T[i]))).normalize(); N.push(v); B.push(T[i].clone().cross(v)); }
  const pos = [], nor = [], uv = [], idx = []; let s = 0;
  for (let i = 0; i < n; i++) { if (i) s += P[i].distanceTo(P[i - 1]);
    for (let j = 0; j <= radial; j++) { const a = j / radial * Math.PI * 2, d = N[i].clone().multiplyScalar(Math.cos(a)).add(B[i].clone().multiplyScalar(Math.sin(a))); pos.push(P[i].x + d.x * r, P[i].y + d.y * r, P[i].z + d.z * r); nor.push(d.x, d.y, d.z); uv.push(s / uvLen, j / radial); } }
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) { const a = i * (radial + 1) + j, b = a + radial + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); return g;
}
function rope(points, R = 0.013, lay = 0.085, o = {}) {
  const path = new THREE.CatmullRomCurve3(points, false, 'centripetal'); path.arcLengthDivisions = 6000;
  const L = path.getLength(), n = Math.ceil(L / Math.min(0.002, lay / 32)), P = path.getSpacedPoints(n);
  const T = P.map((p, i) => P[Math.min(i + 1, n)].clone().sub(P[Math.max(i - 1, 0)]).normalize());
  const N = [V(0, 1, 0).cross(T[0]).normalize()]; for (let i = 1; i <= n; i++) N.push(N[i - 1].clone().sub(T[i].clone().multiplyScalar(N[i - 1].dot(T[i]))).normalize());
  const g = new THREE.Group(), a = R * 0.56, rs = R * 0.52;
  for (let k = 0; k < 3; k++) {
    const Q = P.map((p, i) => { const th = (i / n) * L / lay * Math.PI * 2 + k * Math.PI * 2 / 3, bn = T[i].clone().cross(N[i]); return p.clone().add(N[i].clone().multiplyScalar(Math.cos(th) * a)).add(bn.multiplyScalar(Math.sin(th) * a)); });
    const m = new THREE.Mesh(tubeFromPoints(Q, rs, 12, 0.03), ropeMat(k === 0)); m.castShadow = m.receiveShadow = true; g.add(m);
  }
  const core = new THREE.Mesh(tubeFromPoints(P, R * 0.5, 8, 1), new THREE.MeshStandardMaterial({ color: '#7d7466', roughness: 1 })); g.add(core);
  if (o.whip) g.add(whipping(P[n], T[n], R, o.whip));
  return g;
}

function ropePath(F) {
  // pull direction: from the bollard towards the boat's fairlead, on the ground plane
  const d = V(F.x, 0, F.z).normalize(), u = d.clone().negate(), v = V(0, 1, 0).cross(u).normalize();
  const at = (along, side, y) => u.clone().multiplyScalar(along).add(v.clone().multiplyScalar(side)).setY(y);
  const R = 0.141, Ye = 0.07, ground = 0.024, K = d.clone().multiplyScalar(0.3).setY(ground);
  const legY = r => r < 0.215 ? Ye - (r - 0.141) * 0.15 : r < 0.3 ? ground + (Ye - 0.012 - ground) * (1 - (r - 0.215) / 0.085) ** 2 : ground;
  const leg = (sg, rev) => { const ang = 108 * Math.PI / 180, Tp = at(Math.cos(ang) * R, sg * Math.sin(ang) * R, Ye), pts = []; for (let i = 1; i <= 7; i++) { const t = i / 8, p = Tp.clone().lerp(K, t); p.y = legY(Math.hypot(p.x, p.z)); pts.push(p); } return rev ? pts.reverse() : pts; };
  const pts = [K.clone().add(v.clone().multiplyScalar(0.04)).setY(ground)];
  pts.push(...leg(-1, true));
  for (let a = -108; a <= 108; a += 12) { const r = a * Math.PI / 180; pts.push(at(Math.cos(r) * R, Math.sin(r) * R, Ye + 0.004 * Math.cos(r))); }
  pts.push(...leg(1, false));
  pts.push(K.clone());
  for (const s of [0.55, 0.85, 1.15, 1.45, 1.66]) pts.push(d.clone().multiplyScalar(s).setY(ground + (s > 1.0 ? 0.008 : 0)));
  const edge = d.clone().multiplyScalar(1.79).setY(0.032); pts.push(edge);
  const E2 = d.clone().multiplyScalar(1.83).setY(0.05);
  for (let i = 1; i <= 6; i++) { const t = i / 6, p = E2.clone().lerp(F, t); p.y -= Math.sin(t * Math.PI) * 0.05; pts.push(p); }
  pts.push(F.clone().add(V(-0.03, 0.0, -0.06)));
  return pts;
}


function pill(ctx, x, y, text, s = 1) {
  ctx.font = `700 ${34 * s}px Carlito, Arial, sans-serif`;
  const w = ctx.measureText(text).width + 34 * s, h = 52 * s; const cx = Math.max(w / 2 + 12, Math.min(W - w / 2 - 12, x)), px = cx - w / 2, py = y - h - 18 * s;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 14 * s; ctx.shadowOffsetY = 3 * s; ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.roundRect(px, py, w, h, 26 * s); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 9 * s, py + h - 1); ctx.lineTo(x, py + h + 11 * s); ctx.lineTo(x + 9 * s, py + h - 1); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, py + h / 2 + 1);
}
function notePill(ctx, text) {
  ctx.font = '700 30px Carlito, Arial, sans-serif'; const w = ctx.measureText(text).width + 36, h = 50, x = 28 + w / 2, y = 52;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 14; ctx.fillStyle = 'rgba(10,14,20,.82)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 25); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
}

/* ---------- braided line: sheets, halyards, fender lines ---------- */
// A plaited cover: two families of carriers crossing over and under, one family carrying the fleck colour.

    // the far side OVER the standing part, comes back UNDER it towards the post, and finishes OVER its own entering part
    const pins = []; for (const a of as) pins.push({ at: [a + 0.6 * s, Y], over: 1 }, { at: [a - 0.8 * s, Y], over: 0 }, { at: [a + 0.15 * s, Y + 1.3 * s], over: 'late' });
    const res = flatKnot([sp, end], pins), [SP, EN] = res.ropes;
    const helix = []; for (let k = 0; k <= 70; k++) { const t = k / 70, th = -pi / 2 - 3.5 * pi * t; helix.push(V(rr * Math.cos(th), 0.55 + 1.9 * t, -rr * Math.sin(th))); }
    const tie = [V(5.0, 1.8, 0.5), V(5.45, 1.0, 1.05)];
    if (o.twoTone) { scene.add(braid(scalePts([...SP, ...helix.slice(1)], KS), { R: 0.5 * KS, ...RED, fine: 2 })); scene.add(braid(scalePts([helix[helix.length - 1], ...tie, ...EN], KS), { R: 0.5 * KS, ...BLUE, whip: '#f4f1e6', fine: 2 })); }
    else scene.add(braid(scalePts([...SP, ...helix.slice(1), ...tie, ...EN], KS), { R: 0.5 * KS, ...RED, whip: '#f4f1e6', fine: 2 }));
    const span = 1 + Math.max(0, (as.length ? last : 13.6) - 13.6) * 0.012, c = V((7.2 + Math.max(0, last - 13.6) * 0.45) * KS, 0, 1.6 * KS);
    const cam = new THREE.PerspectiveCamera(34, W / H, 0.01, 20); cam.position.set(c.x + 0.015, 0.4 * span, c.z + 0.1 * span); cam.lookAt(c);
    const L = (x, y, h, t) => [V(x * KS, h * KS, -y * KS), t];
    const labels = [L(3.4, 3.0, 2.4, 'round turn'), L(27, Y, 1, 'standing part')];
    if (o.numbered) as.forEach((a, k) => labels.push(L(a - 0.2 * s, Y + 2.6 * s, 1, k ? '2nd half hitch' : '1st half hitch')));
    else if (as.length) labels.push(L((as[0] + last) / 2 + 1.8, Y + 2.6 * s, 1, as.length > 1 ? 'two half hitches' : 'half hitch'));
    const tp = tail[tail.length - 1]; labels.push(L(tp[0], tp[1], 1, o.twoTone ? 'working end' : 'end'));
    // arrows along the working end, showing the way it travels
    const arrows = []; if (o.arrows) for (let k = 40; k < EN.length - 30; k += 58) { const a = EN[k].clone(), b = EN[Math.min(EN.length - 1, k + 6)].clone(); a.y += 0.75; b.y += 0.75; arrows.push([a.multiplyScalar(KS), b.multiplyScalar(KS)]); }
    return { env: 'outdoor', scene, cam, labels, arrows, note: o.title || 'Round turn and two half hitches', sun: { pos: [-0.6, 1.6, -0.4], target: [0.1, 0, 0], box: 0.6 }, ao: 0.012 };

}
KNOTS['knot-roundturn'] = rtKind({ s: 1.5, gap: 6.4 }); // option A, chosen: looser loops, spaced apart, one colour
const KNOT_OPTS = {
  'rt-a-loose': rtKind({ s: 1.5, gap: 6.4, title: 'A · looser loops' }),
  'rt-b-twotone': rtKind({ twoTone: true, title: 'B · working end in a second colour' }),
  'rt-c-arrows': rtKind({ s: 1.4, gap: 6.0, twoTone: true, arrows: true, numbered: true, title: 'C · loose, two colours, arrows' }),
  'rt-d-step1': rtKind({ s: 1.4, gap: 6.0, twoTone: true, hitches: 0, title: 'D · step 1: round turn' }),
  'rt-d-step2': rtKind({ s: 1.4, gap: 6.0, twoTone: true, hitches: 1, numbered: true, title: 'D · step 2: first half hitch' }),
  'rt-d-step3': rtKind({ s: 1.4, gap: 6.0, twoTone: true, hitches: 2, numbered: true, title: 'D · step 3: second half hitch' }),

// rolling hitch: two riding turns over the standing part towards the load, then a hitch on the far side; the end lies along the rail
KNOTS['knot-rolling'] = railKind('Rolling hitch', (rho, pi) => {
  const f0 = -0.3, pl = (u, a, b) => (u <= a || u >= b) ? 0 : Math.sin(pi * (u - a) / (b - a)) ** 0.5;
  return join([V(-17, -3.4, 3.4), V(-10, -1.6, 2.4), V(-7, rho * Math.sin(f0), rho * Math.cos(f0))],
    wrapPts(-7, 1.0, f0, f0, rho, () => 0, 20),
    wrapPts(1.0, -0.25, f0, 2 * pi + f0, rho, u => 1.05 * bumpAt(u, 1, 0.08)),
    wrapPts(-0.25, -1.5, 2 * pi + f0, 4 * pi + f0, rho, u => 1.05 * (bumpAt(u, 0, 0.08) + bumpAt(u, 1, 0.08))),
    wrapPts(-1.5, 2.1, 4 * pi + f0, 4 * pi + pi / 2, rho, u => 1.1 * Math.max(bumpAt(u, 0, 0.1), pl(u, 0.0, 0.97))),
    wrapPts(2.1, 2.75, 4 * pi + pi / 2, 4 * pi + 3 * pi / 2, rho),
    wrapPts(2.75, 1.45, 4 * pi + 3 * pi / 2, 6 * pi + 1.5, rho),
    [V(2.2, rho + 0.05, 0.05), V(3.3, rho + 0.2, 0.2), V(5.0, rho + 0.6, 0.5), V(6.4, rho + 1.0, 0.8)]);
}, { labels: [[-11, -1.9, 2.6, 'standing part · load'], [6.4, 1.75 + 1.0, 0.8, 'end']], cam: [0.0, 0.07, 0.25], look: [-0.008, -0.003, 0] });

// Contact shading for knots: every point on a rope's surface is darkened as it nears another strand (or a far part of
// its own), so each crossing reads at once: the strand beneath shades where the upper one lies on it, and vice versa.
function bakeContact(scene) {
  const ropes = []; scene.traverse(o => { if (o.isMesh && o.userData.center) ropes.push(o); });
  const p = new THREE.Vector3();
  for (const m of ropes) {
    const pos = m.geometry.attributes.position, nv = pos.count, { per, R, ds } = m.userData, col = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) {
      p.fromBufferAttribute(pos, v); const ring = Math.floor(v / per); let dmin = 1e9;
      for (const o of ropes) { const C = o.userData.center, Ro = o.userData.R, skip = o === m ? Math.ceil(5 * R / ds) : -1;
        for (let k = 0; k < C.length; k++) { if (o === m && Math.abs(k - ring) < skip) continue; const d = p.distanceTo(C[k]) - Ro; if (d < dmin) dmin = d; } }
      const t = Math.min(1, Math.max(0, dmin / (1.5 * R))), f = 0.2 + 0.8 * t * t * (3 - 2 * t);
      col[v * 3] = col[v * 3 + 1] = col[v * 3 + 2] = f;
    }
    m.geometry.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); m.material.vertexColors = true; m.material.needsUpdate = true;
  }
}

const KINDS = { ring: kindRing, winch: kindWinch, cleat: kindCleat, rail: kindRail, sheet: kindSheet };

async function main() {
  await Promise.all([document.fonts.load('700 34px Carlito')]).catch(() => {});
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W * SS, H * SS, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const pm = new THREE.PMREMGenerator(renderer), envTex = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const outdoorEnv = (() => { const es = new THREE.Scene(), g = new THREE.SphereGeometry(50, 64, 32), col = [], pa = g.attributes.position;
    const top = new THREE.Color('#7fa8cc'), hor = new THREE.Color('#f2f4f2'), low = new THREE.Color('#4d5a5e');
    for (let i = 0; i < pa.count; i++) { const y = pa.getY(i) / 50, c = y > 0 ? hor.clone().lerp(top, Math.pow(y, 0.6)) : hor.clone().lerp(low, Math.min(1, -y * 4)); col.push(c.r, c.g, c.b); }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const sunD = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(14, 13, 11) })); sunD.position.set(-18, 34, -26); es.add(sunD);
    return pm.fromScene(es, 0.02).texture; })();
  const qs = new URLSearchParams(location.search), want = qs.get('kind'), list = want ? want.split(',') : qs.get('set') === 'knots' ? Object.keys(KNOTS) : qs.get('set') === 'rtopts' ? Object.keys(KNOT_OPTS) : Object.keys(KINDS);
  window.__renders = {};
  for (const k of list) {
    seed = 7 + k.length * 13;
    const K = (KINDS[k] || KNOTS[k] || KNOT_OPTS[k])(), scene = K.scene, cam = K.cam;
    if (KNOTS[k] || KNOT_OPTS[k]) bakeContact(scene);
    scene.environment = K.env === 'outdoor' ? outdoorEnv : envTex; scene.environmentIntensity = K.env === 'outdoor' ? 0.8 : 0.55;
    const sun = new THREE.DirectionalLight('#fff1dc', 3.2); sun.position.set(...K.sun.pos); sun.target.position.set(...K.sun.target);
    const b = K.sun.box; sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -b, right: b, top: b, bottom: -b, near: 0.3, far: 12 }); sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.002; sun.shadow.radius = 3;
    scene.add(sun, sun.target, new THREE.HemisphereLight('#d6e4ee', '#7c705e', 0.9));
    const comp = new EffectComposer(renderer); comp.setSize(W * SS, H * SS); comp.addPass(new RenderPass(scene, cam));

    comp.addPass(new OutputPass()); comp.render();

    const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.35, W / 2, H * 0.55, H * 0.95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.26)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    for (const [p, text] of K.labels) { const q = p.clone().project(cam); pill(ctx, (q.x + 1) / 2 * W, (1 - q.y) / 2 * H - 4, text); }
    for (const [a, b] of K.arrows || []) { const p = a.clone().project(cam), q = b.clone().project(cam), x = (p.x + 1) / 2 * W, y = (1 - p.y) / 2 * H, ang = Math.atan2((1 - q.y) / 2 * H - y, (q.x + 1) / 2 * W - x);
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-14, -16); ctx.lineTo(-6, 0); ctx.lineTo(-14, 16); ctx.closePath(); ctx.fillStyle = '#ffe600'; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 2.5; ctx.fill(); ctx.stroke(); ctx.restore(); }
    if (K.note) notePill(ctx, K.note);
    const img = new Image(); img.src = out.toDataURL('image/jpeg', 0.92); img.dataset.kind = k; document.getElementById('out').append(img);
