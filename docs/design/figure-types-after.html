<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figure types, improved</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Carlito:wght@400;700&display=swap">
<style>
  :root { --ink: #000; --muted: #6d7a7e; --band: #f2f7f9; --line: #eef2f4; --accent: #0290d7; --bg: #fff; }
  body { margin: 0; background: #fff; font-family: 'Merriweather', Georgia, serif; }
  main { padding: 32px 40px 48px; }
  h1 { font-weight: 300; font-size: 34px; margin: 0 0 6px; letter-spacing: -.02em; }
  .lede { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 40px; }
  .card { border: 2px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .fig { width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: var(--band); position: relative; }
  .fig canvas, .fig svg, .fig img { display: block; width: 100%; height: 100%; }
  .type { font-family: 'Carlito', Arial, sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .02em; color: var(--accent); }
  .type b { color: var(--muted); font-weight: 700; margin-left: 10px; text-transform: none; letter-spacing: 0; }
  .how { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
  .how b { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Every figure type, improved</h1>
  <p class="lede">The sea situations rendered in Helm and Drone; the diagram types drawn as the real thing a skipper looks at, in the same light.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const W = 1280, H = 800;
const px = (ctx, n) => n; // helpers below draw at 1280 × 800
function canvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function paperTexture(ctx, tint = '#f4efe3') {
  ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H);
  // paper fibre and a little age toward the edges
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26000; i++) { ctx.fillStyle = `rgba(${90 + rnd() * 60 | 0},${75 + rnd() * 50 | 0},${50 + rnd() * 40 | 0},${0.025 + rnd() * 0.04})`; ctx.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 2, 1); }
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,50,20,.18)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function lightFromLeft(ctx, strength = 0.12) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, `rgba(255,255,255,${strength})`); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function grain(ctx, amt = 6) { const img = ctx.getImageData(0, 0, W, H), d = img.data; let s = 3; for (let i = 0; i < d.length; i += 4) { s = (s * 16807) % 2147483647; const n = (s / 2147483647 - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; } ctx.putImageData(img, 0, 0); }
function label(ctx, x, y, text, o = {}) { ctx.font = `${o.w || 700} ${o.s || 30}px Carlito, Arial, sans-serif`; ctx.fillStyle = o.f || '#1a1d21'; ctx.textAlign = o.a || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y); }
function pill(ctx, x, y, text, fill = '#fff', ink = '#000') { ctx.font = '700 30px Carlito, Arial, sans-serif'; const w = ctx.measureText(text).width + 36, h = 52; ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; ctx.fillStyle = fill; roundRect(ctx, x - w / 2, y - h / 2, w, h, 26); ctx.fill(); ctx.restore(); label(ctx, x, y + 1, text, { f: ink, a: 'center' }); }

/* ---- chart: a paper chart with a hand-laid pencil fix, a brass divider lying across it ---- */
function chart(f) {
  const c = canvas(), ctx = c.getContext('2d');
  paperTexture(ctx, '#f6f1e4');
  // sea tint on the chart, a land mass, soundings, a compass rose
  ctx.fillStyle = 'rgba(190,220,235,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e9dfb8'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * 0.32, 0); ctx.bezierCurveTo(W * 0.2, H * 0.25, W * 0.3, H * 0.5, W * 0.12, H * 0.7); ctx.lineTo(0, H * 0.8); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a7a52'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#c9c0a4'; ctx.font = '400 20px Carlito'; let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { const x = W * 0.3 + rnd() * W * 0.68, y = rnd() * H; ctx.fillStyle = '#6a6a7a'; ctx.fillText(String(3 + Math.floor(rnd() * 40)), x, y); }
  // lat/long border scales
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, 44); ctx.fillRect(0, 0, 70, H); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, W, 44); ctx.strokeRect(0, 0, 70, H);
  for (let x = 70; x < W; x += 40) { const big = ((x - 70) / 40) % 5 === 0; ctx.fillStyle = big ? '#000' : '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.fillRect(x, big ? 30 : 36, 40, big ? 14 : 8); ctx.strokeRect(x, 30, 40, 14); }
  for (let y = 44; y < H; y += 40) { const big = ((y - 44) / 40) % 5 === 0; ctx.fillStyle = big ? '#000' : '#fff'; ctx.fillRect(big ? 56 : 62, y, big ? 14 : 8, 40); ctx.strokeRect(56, y, 14, 40); }
  label(ctx, 300, 20, "4°10'W", { s: 24, a: 'center' }); label(ctx, 980, 20, "4°05'W", { s: 24, a: 'center' });
  ctx.save(); ctx.translate(30, 200); ctx.rotate(-Math.PI / 2); label(ctx, 0, 0, "50°20'N", { s: 24, a: 'center' }); ctx.restore();
  ctx.save(); ctx.translate(30, 650); ctx.rotate(-Math.PI / 2); label(ctx, 0, 0, "50°18'N", { s: 24, a: 'center' }); ctx.restore();
  // pencil: the parallel and meridian through the buoy, drawn by hand, slightly uneven
  ctx.strokeStyle = 'rgba(40,40,45,.75)'; ctx.lineWidth = 3; ctx.setLineDash([]);
  const wob = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); for (let t = 0.1; t <= 1; t += 0.1) ctx.lineTo(x0 + (x1 - x0) * t + (rnd() - 0.5) * 3, y0 + (y1 - y0) * t + (rnd() - 0.5) * 3); ctx.stroke(); };
  wob(300, 44, 300, H); wob(980, 44, 980, H); wob(70, 200, W, 200); wob(70, 650, W, 650);
  // the buoy: a chart symbol, with a pencil circle round it and the fix ticks
  const bx = 690, by = 430; ctx.fillStyle = '#e8a300'; ctx.beginPath(); ctx.moveTo(bx - 14, by + 10); ctx.lineTo(bx, by - 26); ctx.lineTo(bx + 14, by + 10); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(bx, by + 14, 4, 0, 7); ctx.fill();
  label(ctx, bx + 24, by - 6, 'Fl Y 5s', { s: 22, w: 400, f: '#333' });
  ctx.strokeStyle = 'rgba(40,40,45,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bx, by + 2, 34, 0, 7); ctx.stroke();
  wob(bx - 60, by + 2, bx + 60, by + 2); wob(bx, by - 60, bx, by + 60);
  // dividers lying across the corner, with a shadow
  ctx.save(); ctx.translate(1010, 560); ctx.rotate(-0.55); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 12;
  ctx.strokeStyle = '#b89a4a'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, 230); ctx.moveTo(0, 0); ctx.lineTo(70, 230); ctx.stroke();
  ctx.fillStyle = '#d6b65c'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill(); ctx.restore();
  lightFromLeft(ctx, 0.08); grain(ctx, 5);
  return c;
}
/* ---- panel: a diesel engine panel at the companionway, running: brushed bezel, black face, a big tachometer with the hour meter, four small gauges, a lamp cluster, key, start and stop ---- */
function panel(f) {
  const c = canvas(), ctx = c.getContext('2d'); let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = f.gauges || [['hours', '2312.1'], ['volts', '12.6'], ['fuel', '4/4']];
  // varnished teak bulkhead, lit from the top left
  { const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#7a4f2b'); bg.addColorStop(1, '#4a2e17'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); }
  for (let x = -20; x < W; x += 86) { ctx.fillStyle = `rgba(25,14,6,${0.25 + rnd() * 0.2})`; ctx.fillRect(x, 0, 4, H); for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(${20 + rnd() * 30 | 0},12,5,${0.06 + rnd() * 0.12})`; ctx.fillRect(x + rnd() * 86, rnd() * H, 1 + rnd(), 30 + rnd() * 160); } }
  { const gl = ctx.createLinearGradient(0, 0, W * 0.6, H); gl.addColorStop(0, 'rgba(255,230,190,.2)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H); }
  // the panel: a brushed-aluminium bezel around a black powder-coated face
  const px0 = 110, py0 = 80, pw = 1060, ph = 640;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; ctx.fillStyle = '#17191c'; roundRect(ctx, px0, py0, pw, ph, 20); ctx.fill(); ctx.restore();
  { const bz = ctx.createLinearGradient(px0, py0, px0 + pw, py0 + ph); bz.addColorStop(0, '#c3c8cd'); bz.addColorStop(0.3, '#8d9298'); bz.addColorStop(0.5, '#d9dde1'); bz.addColorStop(0.75, '#7f848a'); bz.addColorStop(1, '#aeb3b8'); ctx.fillStyle = bz; roundRect(ctx, px0, py0, pw, ph, 20); ctx.fill(); }
  ctx.save(); roundRect(ctx, px0, py0, pw, ph, 20); ctx.clip(); for (let i = 0; i < 1400; i++) { ctx.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)'; ctx.fillRect(px0, py0 + rnd() * ph, pw, 1); } ctx.restore();
  const fx = px0 + 18, fy = py0 + 18, fw = pw - 36, fh = ph - 36;
  { const fg = ctx.createLinearGradient(fx, fy, fx, fy + fh); fg.addColorStop(0, '#2b2e32'); fg.addColorStop(1, '#131517'); ctx.fillStyle = fg; roundRect(ctx, fx, fy, fw, fh, 14); ctx.fill(); }
  ctx.save(); roundRect(ctx, fx, fy, fw, fh, 14); ctx.clip(); for (let i = 0; i < 9000; i++) { ctx.fillStyle = `rgba(255,255,255,${rnd() * 0.05})`; ctx.fillRect(fx + rnd() * fw, fy + rnd() * fh, 1.5, 1.5); } ctx.restore();
  for (const [sx, sy] of [[px0 + 26, py0 + 26], [px0 + pw - 26, py0 + 26], [px0 + 26, py0 + ph - 26], [px0 + pw - 26, py0 + ph - 26]]) { const sg = ctx.createRadialGradient(sx - 3, sy - 3, 1, sx, sy, 10); sg.addColorStop(0, '#eef0f2'); sg.addColorStop(1, '#5c6166'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#2a2d31'; ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ctx[k ? 'lineTo' : 'moveTo'](sx + Math.cos(a) * 4.5, sy + Math.sin(a) * 4.5); } ctx.closePath(); ctx.fill(); }
  label(ctx, fx + 24, fy + 24, 'MARINE DIESEL · CONTROL PANEL', { s: 15, f: '#7d838a', w: 700 });
  // a gauge: chrome ring, black dial, white ticks and numerals, a red zone, an orange needle, a domed glass
  const dial = (x, y, R, o) => {
    const rg = ctx.createRadialGradient(x - R * 0.3, y - R * 0.3, R * 0.5, x, y, R + 10); rg.addColorStop(0, '#dfe3e7'); rg.addColorStop(0.7, '#6f757b'); rg.addColorStop(1, '#2d3135'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, R + 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a0b0c'; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    if (o.red) { ctx.strokeStyle = '#d2232a'; ctx.lineWidth = R * 0.09; ctx.beginPath(); ctx.arc(x, y, R * 0.84, a0 + (a1 - a0) * o.red[0], a0 + (a1 - a0) * o.red[1]); ctx.stroke(); }
    const n = (o.nums?.length ?? 11) - 1;
    for (let i = 0; i <= n * 2; i++) { const a = a0 + (a1 - a0) * i / (n * 2), big = i % 2 === 0; ctx.strokeStyle = '#f4f1ea'; ctx.lineWidth = big ? R * 0.03 : R * 0.015; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * R * 0.78, y + Math.sin(a) * R * 0.78); ctx.lineTo(x + Math.cos(a) * R * (big ? 0.9 : 0.86), y + Math.sin(a) * R * (big ? 0.9 : 0.86)); ctx.stroke(); }
    if (o.nums) for (let i = 0; i < o.nums.length; i++) { if (!o.nums[i]) continue; const a = a0 + (a1 - a0) * i / (o.nums.length - 1); label(ctx, x + Math.cos(a) * R * 0.63, y + Math.sin(a) * R * 0.63, o.nums[i], { s: R * 0.17, a: 'center', f: '#f4f1ea' }); }
    label(ctx, x, y + R * 0.3, o.title, { s: R * 0.15, a: 'center', f: '#d9d5cb' }); if (o.sub) label(ctx, x, y + R * 0.45, o.sub, { s: R * 0.11, a: 'center', f: '#9a968d', w: 400 });
    if (o.lcd) { const lw = R * 0.9, lh = R * 0.26, ly = y + R * 0.5; ctx.fillStyle = '#1b1f1c'; roundRect(ctx, x - lw / 2, ly, lw, lh, 4); ctx.fill(); ctx.fillStyle = '#c4d6a4'; roundRect(ctx, x - lw / 2 + 3, ly + 3, lw - 6, lh - 6, 3); ctx.fill(); ctx.font = `700 ${R * 0.2 | 0}px Carlito, monospace`; ctx.fillStyle = '#1f2a1c'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(o.lcd, x + lw / 2 - 8, ly + lh / 2 + 1); ctx.textAlign = 'left'; ctx.font = `400 ${R * 0.1 | 0}px Carlito`; ctx.fillStyle = '#3d4a38'; ctx.fillText('HOURS', x - lw / 2 + 7, ly + lh / 2 + 1); }
    const a = a0 + (a1 - a0) * Math.max(0, Math.min(1, o.val)); ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4; ctx.fillStyle = '#ff5a2e'; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * R * 0.18, y - Math.sin(a) * R * 0.18); ctx.lineTo(x + Math.cos(a + Math.PI / 2) * R * 0.03, y + Math.sin(a + Math.PI / 2) * R * 0.03); ctx.lineTo(x + Math.cos(a) * R * 0.86, y + Math.sin(a) * R * 0.86); ctx.lineTo(x - Math.cos(a + Math.PI / 2) * R * 0.03, y - Math.sin(a + Math.PI / 2) * R * 0.03); ctx.closePath(); ctx.fill(); ctx.restore();
    const hub = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, R * 0.09); hub.addColorStop(0, '#8d9298'); hub.addColorStop(1, '#1c1f22'); ctx.fillStyle = hub; ctx.beginPath(); ctx.arc(x, y, R * 0.09, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.clip(); const gr = ctx.createLinearGradient(x - R, y - R, x + R * 0.4, y + R * 0.4); gr.addColorStop(0, 'rgba(255,255,255,.3)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.fillRect(x - R, y - R, 2 * R, 2 * R); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.55, R * 0.5, R * 0.22, -0.5, 0, 7); ctx.fill(); ctx.restore();
  };
  dial(400, 350, 170, { title: 'RPM', sub: 'x100', nums: ['0', '5', '10', '15', '20', '25', '30', '35', '40'], red: [0.86, 1], val: 0.55, lcd: g[0][1] });
  dial(770, 262, 82, { title: 'VOLTS', nums: ['8', '10', '12', '14', '16'], red: [0, 0.12], val: ((parseFloat(g[1][1]) || 12.6) - 8) / 8 });
  dial(970, 262, 82, { title: 'FUEL', nums: ['E', '', '½', '', 'F'], red: [0, 0.1], val: String(g[2][1]).includes('/') ? (+g[2][1].split('/')[0] / +g[2][1].split('/')[1]) : 0.5 });
  dial(770, 462, 82, { title: 'TEMP', sub: '°C', nums: ['40', '', '80', '', '120'], red: [0.82, 1], val: 0.52 });
  dial(970, 462, 82, { title: 'OIL', sub: 'bar', nums: ['0', '', '3', '', '6'], red: [0, 0.12], val: 0.62 });
  // the lamp cluster: engine running, so only the run lamp is lit
  [['PREHEAT', '#f0a020', false], ['CHARGE', '#e03030', false], ['OIL', '#e03030', false], ['TEMP', '#e03030', false], ['RUN', '#30d060', true]].forEach(([t, col, on], i) => { const lx = 690 + i * 100, ly = 612; ctx.fillStyle = '#0a0b0c'; ctx.beginPath(); ctx.arc(lx, ly, 17, 0, 7); ctx.fill(); const lg = ctx.createRadialGradient(lx - 4, ly - 4, 2, lx, ly, 14); if (on) { lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.35, col); lg.addColorStop(1, col); ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 26; } else { lg.addColorStop(0, '#5a5e62'); lg.addColorStop(1, '#222'); } ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, 13, 0, 7); ctx.fill(); if (on) ctx.restore(); label(ctx, lx, ly + 36, t, { s: 15, a: 'center', f: '#c9ced3' }); });
  // the key switch, turned to ON
  { const kx = 250, ky = 600; const kg = ctx.createRadialGradient(kx - 8, ky - 8, 4, kx, ky, 40); kg.addColorStop(0, '#f0f2f4'); kg.addColorStop(0.6, '#8a9096'); kg.addColorStop(1, '#2b2f33'); ctx.fillStyle = kg; ctx.beginPath(); ctx.arc(kx, ky, 40, 0, 7); ctx.fill(); ctx.fillStyle = '#0b0c0d'; ctx.beginPath(); ctx.arc(kx, ky, 26, 0, 7); ctx.fill();
    for (const [a, t] of [[-0.9, 'OFF'], [-0.2, 'ON'], [0.5, 'START']]) label(ctx, kx + Math.cos(a - Math.PI / 2) * 62, ky + Math.sin(a - Math.PI / 2) * 62, t, { s: 14, a: 'center', f: '#c9ced3' });
    ctx.save(); ctx.translate(kx, ky); ctx.rotate(-0.2 + Math.PI); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 6; ctx.fillStyle = '#1a1b1d'; roundRect(ctx, -11, -4, 22, 66, 8); ctx.fill(); ctx.fillStyle = '#2a2b2e'; ctx.beginPath(); ctx.arc(0, 54, 5, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#c4c9ce'; ctx.beginPath(); ctx.arc(kx, ky, 6, 0, 7); ctx.fill();
  }
  // start and stop buttons, and the buzzer grille
  const button = (bx, by, col, t) => { ctx.fillStyle = '#0a0b0c'; ctx.beginPath(); ctx.arc(bx, by, 34, 0, 7); ctx.fill(); const bg = ctx.createRadialGradient(bx - 8, by - 10, 4, bx, by, 30); bg.addColorStop(0, col[0]); bg.addColorStop(1, col[1]); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, 28, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(bx - 6, by - 12, 12, 6, -0.4, 0, 7); ctx.fill(); label(ctx, bx, by + 52, t, { s: 15, a: 'center', f: '#c9ced3' }); };
  button(430, 600, ['#3a3d41', '#121315'], 'START'); button(540, 600, ['#ff5a4a', '#8e0f12'], 'STOP');
  { const gx = 625, gy = 600; ctx.fillStyle = '#0a0b0c'; ctx.beginPath(); ctx.arc(gx, gy, 20, 0, 7); ctx.fill(); ctx.fillStyle = '#2d3135'; for (let r = 0; r <= 2; r++) for (let k = 0; k < (r ? r * 6 : 1); k++) { const a = k / (r * 6 || 1) * Math.PI * 2; ctx.beginPath(); ctx.arc(gx + Math.cos(a) * r * 6, gy + Math.sin(a) * r * 6, 2, 0, 7); ctx.fill(); } }
  if (f.lines?.[0]) pill(ctx, W / 2, H - 40, f.lines[0]);
  lightFromLeft(ctx, 0.1); grain(ctx, 5);
  return c;
}
/* ---- rope: a bowline dropped over a quayside bollard, from above at arm's length: wet granite, iron, three-strand polyester ---- */
function rope(f) {
  const c = canvas(), ctx = c.getContext('2d'); let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  panel: '<b>The engine panel</b> at the companionway, engine running: a brushed bezel, the tachometer with the hour meter in it, volts, fuel, temperature and oil, the lamp cluster, key, start and stop. The form\'s figure sits on a pill.',
  rope: '<b>The line and the fitting</b> rendered in 3D like the sea scenes: three-strand line with its lay, the loop dropped over a cast-iron bollard on granite setts, the yacht alongside. The knot stays hidden behind the bollard: the picture shows the situation, never the answer.',
  isobars: '<b>The synoptic chart</b> as pinned up at the harbour office: printed isobars with values, the H, wind barbs clockwise round it, the route pencilled on, a fax header with the time.',
  compass: '<b>The steering compass</b> from the helm: a black card floating under the dome with the course under the red lubber line, reflections on the glass; variation and course on pills.',
  card: '<b>The paper itself</b>: the check-in form on a clipboard on the charter desk, the facts typed in the ruled lines, a pen lying across it. Questions with nothing to draw still get a picture of the thing in hand.',
};
const order = ['encounter', 'lights', 'buoy', 'dayshape', 'sail', 'anchor', 'bay', 'race', 'chart', 'panel', 'rope', 'isobars', 'compass', 'card'];
const counts = { card: 3599, race: 569, chart: 320, lights: 154, encounter: 137, panel: 89, rope: 72, bay: 71, sail: 47, buoy: 33, isobars: 31, anchor: 29, dayshape: 21, compass: 21 };
window.__renders = {};
(async () => {
  const picked = await (await fetch('figure-types.json')).json();
  await document.fonts.ready;
  const grid = document.getElementById('grid');
  for (const t of order) {
    const p = picked[t]; const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="type">${t} <b>${counts[t]} questions · ${p.level} ${p.id}</b></div><div class="fig"></div><div class="how">${HOW[t]}</div>`;
    const fig = el.querySelector('.fig');
    if (MOCK[t]) { const c = MOCK[t](p.figure); fig.append(c); window.__renders[t] = c.toDataURL('image/jpeg', 0.92); }
    else { const im = new Image(); im.src = `figure-style/types/${t}.jpg`; im.onerror = () => { fig.innerHTML = '<div style="padding:24px;font:15px Merriweather;color:#6d7a7e">rendered by the 3D spike</div>'; }; fig.append(im); }
    grid.append(el);
  }
  document.body.dataset.done = '1';
})();
</script>
